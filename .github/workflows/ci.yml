name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Check syntax
        run: python -m compileall -q superblock
      - name: Run regression tests
        run: python -m pytest -q
      - name: Verify installed package outside the checkout
        shell: bash
        run: |
          python -m pip wheel --no-deps --wheel-dir "$RUNNER_TEMP/wheels" .
          python -m pip install --force-reinstall --no-deps "$RUNNER_TEMP"/wheels/superblock-*.whl
          cd "$RUNNER_TEMP"
          python -m superblock.demo --runs-dir "$RUNNER_TEMP/superblock-smoke"
